name: Build APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [assembleDebug, assembleRelease]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Fix Windows Line Endings in gradlew
        run: |
          python3 << 'EOF'
          with open('gradlew', 'rb') as f:
              content = f.read()
          content = content.replace(b'\r\n', b'\n').replace(b'\r', b'\n')
          with open('gradlew', 'wb') as f:
              f.write(content)
          EOF
          chmod +x ./gradlew
        shell: bash

      - name: Build ${{ matrix.variant }}
        env:
          VARIANT: ${{ matrix.variant }}
        run: ./gradlew $VARIANT --no-daemon -Porg.gradle.jvmargs="-Xmx2048m"

      - name: Upload artifact - ${{ matrix.variant }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.variant }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            Release created by GitHub Actions
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
