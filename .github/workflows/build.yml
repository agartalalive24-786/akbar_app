name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Normalize gradlew and make executable
      run: |
        python3 -c "
        with open('gradlew', 'rb') as f:
            content = f.read()
        content = content.replace(b'\r\n', b'\n').replace(b'\r', b'\n')
        with open('gradlew', 'wb') as f:
            f.write(content)
        "
        chmod +x gradlew
      shell: bash

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon
      shell: bash

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
      shell: bash

    - name: Check APKs exist
      id: check_apks
      run: |
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "debug_exists=true" >> $GITHUB_OUTPUT
        else
          echo "debug_exists=false" >> $GITHUB_OUTPUT
        fi
        if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
          echo "release_exists=true" >> $GITHUB_OUTPUT
        else
          echo "release_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload Debug APK
      if: steps.check_apks.outputs.debug_exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK
      if: steps.check_apks.outputs.release_exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Chess Vision Pro ${{ github.ref }}
        body: |
          ## Release Notes
          - Build timestamp: ${{ github.event.head_commit.timestamp }}
          - Commit: ${{ github.event.head_commit.message }}
        draft: false
        prerelease: false
